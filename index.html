<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Branding</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:linear-gradient(135deg,#e6fffa,#f7fafc);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .card{max-width:520px;background:#fff;border-radius:16px;box-shadow:0 12px 28px rgba(0,0,0,.12);padding:36px;text-align:center}
    img{width:110px;height:110px;border-radius:16px;object-fit:cover}
    h1{margin:14px 0 8px;color:#0f766e}
    p{color:#4a5568;line-height:1.6}
    button{margin-top:18px;background:#0f766e;color:#fff;border:0;padding:14px 22px;font-size:16px;border-radius:10px;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <img id="logo" src="https://via.placeholder.com/120x120.png?text=Clinic" alt="Clinic Logo">
    <h1 id="clinicName">Clinic Name</h1>
    <p id="welcome">Welcome to our clinic queue system.</p>
    <button onclick="goLogin()">Enter System</button>
  </div>

  <script>
    function goLogin(){ window.location.href='?page=login'; }
    google.script.run.withSuccessHandler(function(settings){
      document.getElementById('logo').src = settings.clinicLogo || document.getElementById('logo').src;
      document.getElementById('clinicName').textContent = settings.clinicName || 'Clinic';
      document.getElementById('welcome').textContent = settings.welcomeMessage || '';
      if(settings.primaryColor){ document.querySelector('h1').style.color = settings.primaryColor; document.querySelector('button').style.background = settings.primaryColor; }
    }).getSettingsObject();
  </script>
</body>
</html>
